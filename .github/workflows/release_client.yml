name: release_client

# Publishes the Hashimon client for Windows and macOS.
# Push a tag "client-v<x.y.z>" to build and release.
on:
  push:
    tags:
      - 'client-v*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows launcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install compiler
        run: |
          source ./util/ci/common.sh
          install_mingw_deps 64 true
          sudo ./util/buildbot/download_toolchain.sh /usr

      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#client-v}"
          EXISTING_MINETEST_DIR=$PWD \
          ./util/buildbot/buildwin64.sh B \
            -DRUN_IN_PLACE=0 \
            -DDEVELOPMENT_BUILD=FALSE \
            -DENABLE_UPDATE_CHECKER=FALSE \
            -DVERSION_EXTRA="hashimon-$VER"

      - name: Package self-extracting launcher
        run: |
          dest=$(mktemp -d)
          unzip -q -d "$dest" B/build/*-nsis.zip
          cd "$dest"/luanti-*-nsis
          # the extracted payload is what the launcher will ship, test it first
          wine bin/luanti.exe --version
          makensis -WX -V3 sfx-launcher.nsi
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp -v "$dest"/*.exe "$GITHUB_WORKSPACE/artifact/hashimon-client-win64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: hashimon-client-win64
          path: artifact/hashimon-client-win64.exe
          if-no-files-found: error

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      osver: '11.3'
      xcodever: '16.2'
      build_type: Release
      arch: ${{ matrix.arch }}
      USE_XCODE: 'no'
    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          mkdir downloads
          source ./util/ci/common.sh
          source ./util/ci/macos_sdk.sh
          install_macos_precompiled_deps "$osver" "$arch"
          install_macos_sdk "$osver" "$xcodever" downloads

      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#client-v}"
          mkdir build
          cd build
          export DEPS_DIR="/Users/Shared/macos${osver}_${arch}_deps"
          ../util/ci/build_macos.sh \
            -DDEVELOPMENT_BUILD=FALSE \
            -DENABLE_UPDATE_CHECKER=FALSE \
            -DVERSION_EXTRA="hashimon-$VER"

      - name: Runtime test
        run: ./build/macos/luanti.app/Contents/MacOS/luanti --version

      # Ad-hoc sign so Gatekeeper allows the app to run.
      # Without a Developer ID certificate this is the minimum required;
      # users will need to right-click → Open on first launch.
      - name: Codesign (ad-hoc)
        run: |
          codesign --force --deep -s - \
            --entitlements misc/macos/entitlements/release.entitlements \
            --options runtime \
            build/macos/luanti.app
          codesign --verify --deep --strict build/macos/luanti.app

      - name: Package DMG
        run: |
          brew install --quiet create-dmg
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          create-dmg \
            --volname "Luanti" \
            --volicon "misc/luanti-icon.icns" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "luanti.app" 160 180 \
            --hide-extension "luanti.app" \
            --app-drop-link 380 180 \
            "$GITHUB_WORKSPACE/artifact/hashimon-client-macos-${arch}.dmg" \
            "build/macos/"

      - uses: actions/upload-artifact@v7
        with:
          name: hashimon-client-macos-${{ matrix.arch }}
          path: artifact/hashimon-client-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find assets -type f)
          # one Windows launcher plus the two macOS DMGs (arm64 + x86_64);
          # anything else means an artifact was unpacked instead of coming back whole
          [ "${#files[@]}" -eq 3 ] || { printf 'expected 3 release assets, found %d:\n' "${#files[@]}"; printf '%s\n' "${files[@]}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hashimon client ${GITHUB_REF_NAME#client-v}" \
            --latest \
            --generate-notes \
            "${files[@]}"
