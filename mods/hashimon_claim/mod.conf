name = hashimon_claim
title = Hashimon Claim (friendly /expand)
description = A retail-friendly claim command for Towny. /expand grabs the nearest FREE mapblock that borders your town near where you stand (biased toward the way you face), instead of Towny's strict "stand exactly in an unclaimed block orthogonally adjacent to your town". Skips blocks that are already yours; never errors just because your feet are in a claimed block. Additive companion: uses Towny's own public API + block.new; never modifies the towny mod. Respects Towny's limits, permissions and the outpost cap.
depends = towny
optional_depends =
