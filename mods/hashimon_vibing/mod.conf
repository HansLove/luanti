name = hashimon_vibing
title = Hashimon Vibing Towers
description = Vibing towers (docs/VIBING_V1.md §3): a town plants a tower INSIDE its own claim to tap the yield of that coordinate. V1 = the placeable, town-gated, capped structure + a map POI pushed to the API so the website shows it with the tier it taps (the web derives the tier from the coord via zona(x,z)). Real extraction + heat come later (POW_YIELD). Additive: reads Towny + pushes a projection; never edits towny. Its own vibing_towers channel (not Lovable's map_markers).
depends = towny
optional_depends = hashimon_core, discovery_maps
