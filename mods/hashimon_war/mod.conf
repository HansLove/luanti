name = hashimon_war
title = Hashimon War (Risk V1)
description = Risk-style V1 warfare for Towny claims: towns whose claims collide are automatically at war. Territory musters troops (fichas) over time; you deploy them into your quadrants and attack adjacent enemy quadrants with virtual dice from a /war formspec panel. Losing a quadrant's fichas hands it over (claim capture); the capital is immune. Troop counts float over quadrants as a HUD. No Magi/economy yet (that is V2). Reads Towny + only transfers a captured, non-home quadrant via Towny's own API.
depends = towny
optional_depends = hashimon_towny_border, hashimon_core
